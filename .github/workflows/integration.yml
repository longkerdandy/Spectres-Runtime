name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Start PostgreSQL
        run: docker compose --env-file .env.test up -d
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            docker exec spectres-db pg_isready -U "$DB_USER" && exit 0
            sleep 1
          done
          echo "PostgreSQL did not become ready in time"
          exit 1
        env:
          DB_USER: ${{ secrets.DB_USER }}

      - name: Run integration tests
        run: uv run pytest -m integration
        env:
          SPECTRES_ENV_FILE: .env.test
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          TEAM_LEADER_LLM_API_KEY: ${{ secrets.TEAM_LEADER_LLM_API_KEY }}
          # CI uses Gemini (AI Studio free tier): BigModel's free model is
          # congested at peak times (429), and Gemini is region-restricted on
          # the owner's network, so only CI overrides these; local runs keep
          # the BigModel settings committed in .env.test.
          TEAM_LEADER_LLM_MODEL: gemini-2.5-flash
          TEAM_LEADER_LLM_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai
          # Live FTShare smoke test: guards against silent SDK/API drift
          # (mocked tests cannot catch provider-side contract changes).
          ETF_GRID_FTSHARE_API_KEY: ${{ secrets.FTSHARE_API_KEY }}
